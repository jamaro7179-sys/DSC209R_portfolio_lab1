<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Meta</title>
</head>
<body>
    <h1>Meta</h1>
    <div id="stats"></div>

    <h2>Commit Activity by Time of Day</h2>


    <div>
        <label>
          Show commits until:
          <input type="range" id="commit-progress" min="0" max="100" value="100">
          <time id="commit-time"></time>
        </label>
    </div>
     

    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="tooltip-link" target="_blank"></a></dd>
        <dt>Author</dt>
        <dd id="tooltip-author"></dd>
        <dt>Date</dt>
        <dd id="tooltip-date"></dd>
        <dt>Time</dt>
        <dd id="tooltip-time"></dd>
        <dt>Lines</dt>
        <dd id="tooltip-lines"></dd>
    </dl>

    <dl id="files">
        <!-- we want the following structure for each file:
        <div>
          <dt>
            <code>{file.name}</code>
          </dt>
          <dd>{file.lines.length} lines</dd>
        </div>
        -->
    </dl>

</body>

<script src="../global.js" type="module"></script>
<script src="main.js" type="module"></script>
</html>
