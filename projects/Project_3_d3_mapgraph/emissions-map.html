<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CO2 Emissions by Country</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<link rel="stylesheet" href="emissions-map.css">
</head>
<body>
<div class="page">
  <h1>CO2 Emissions by Country</h1>
  <p class="sub">Brighter red means more emissions. The color scale is fixed across years for the selected industry, so you can see change over time. Grey = no data.</p>
  <div class="controls">
    <label>Industry: <select id="industry"></select></label>
    <label>Year: <input id="year" type="range" min="1995" max="2018" value="2018"> <b id="yv">2018</b></label>
  </div>
  <svg id="map" viewBox="0 0 960 500"></svg>
</div>
<div id="tip"></div>

<script src="emissions-data.js"></script>
<script src="emissions-map.js"></script>
</body>
</html>
